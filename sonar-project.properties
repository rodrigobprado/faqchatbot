sonar.projectKey=faqchatbot
sonar.sources=.

# Artefatos gerados nunca devem ser analisados
sonar.exclusions=**/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/pnpm-lock.yaml,\
  **/*.min.js,\
  **/drizzle/meta/**

# Testes sao identificados como testes (nao contam como codigo produtivo)
sonar.tests=apps/api/src,apps/dashboard/src,apps/widget/src,packages/config/src,packages/contracts/src,packages/logger/src,packages/sdk-js/src,packages/testing/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.e2e.spec.ts

# Cobertura real gerada pelo vitest
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/dashboard/coverage/lcov.info,apps/widget/coverage/lcov.info,packages/contracts/coverage/lcov.info,packages/sdk-js/coverage/lcov.info,packages/testing/coverage/lcov.info,packages/config/coverage/lcov.info,packages/logger/coverage/lcov.info
