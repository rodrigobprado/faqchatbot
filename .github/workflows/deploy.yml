name: CD faqchatbot

on:
  push:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux]
    env:
      BASE_DIR: /wwwroot/sites/faqchatbot

    steps:
      - name: limpa workspace anterior
        run: rm -Rf "${{ github.workspace }}"

      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: habilita corepack
        run: corepack enable

      - name: instala dependencias
        run: corepack pnpm install --frozen-lockfile

      - name: valida qualidade
        run: |
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm build

      - name: resolve ambiente
        id: env
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "host=faqchatbot.rigbie.com.br" >> "$GITHUB_OUTPUT"
              echo "api_port=3010" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "branch=staging" >> "$GITHUB_OUTPUT"
              echo "host=faqchatbot-staging.rigbie.com.br" >> "$GITHUB_OUTPUT"
              echo "api_port=3011" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "branch=develop" >> "$GITHUB_OUTPUT"
              echo "host=faqchatbot-develop.rigbie.com.br" >> "$GITHUB_OUTPUT"
              echo "api_port=3012" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              echo "host=${GITHUB_REF_NAME}.rigbie.com.br" >> "$GITHUB_OUTPUT"
              echo "api_port=3010" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: prepara shared
        shell: bash
        run: |
          BRANCH_DIR="${BASE_DIR}/${{ steps.env.outputs.branch }}"
          mkdir -p "${BRANCH_DIR}/shared/log" "${BRANCH_DIR}/releases"

          if [ ! -f "${BRANCH_DIR}/shared/.env" ]; then
            cp .env.example "${BRANCH_DIR}/shared/.env"
          fi

          if grep -q '^APP_BRANCH=' "${BRANCH_DIR}/shared/.env"; then
            sed -i "s#^APP_BRANCH=.*#APP_BRANCH=${{ steps.env.outputs.branch }}#" "${BRANCH_DIR}/shared/.env"
          else
            printf 'APP_BRANCH=%s\n' "${{ steps.env.outputs.branch }}" >> "${BRANCH_DIR}/shared/.env"
          fi

          if grep -q '^API_PORT=' "${BRANCH_DIR}/shared/.env"; then
            sed -i "s#^API_PORT=.*#API_PORT=${{ steps.env.outputs.api_port }}#" "${BRANCH_DIR}/shared/.env"
          else
            printf 'API_PORT=%s\n' "${{ steps.env.outputs.api_port }}" >> "${BRANCH_DIR}/shared/.env"
          fi

          if grep -q '^API_PUBLIC_URL=' "${BRANCH_DIR}/shared/.env"; then
            sed -i "s#^API_PUBLIC_URL=.*#API_PUBLIC_URL=https://${{ steps.env.outputs.host }}#" "${BRANCH_DIR}/shared/.env"
          else
            printf 'API_PUBLIC_URL=https://%s\n' "${{ steps.env.outputs.host }}" >> "${BRANCH_DIR}/shared/.env"
          fi

      - name: publica release
        shell: bash
        run: |
          BRANCH_DIR="${BASE_DIR}/${{ steps.env.outputs.branch }}"
          RELEASE_DIR="${BRANCH_DIR}/releases/${{ github.run_number }}"

          mkdir -p "${BRANCH_DIR}/releases"
          rm -Rf "${RELEASE_DIR}"
          cp -a "${{ github.workspace }}/." "${RELEASE_DIR}/"

          ln -sfn "${BRANCH_DIR}/shared/.env" "${RELEASE_DIR}/.env"
          ln -sfn "${BRANCH_DIR}/shared/log" "${RELEASE_DIR}/log"
          ln -sfn "${RELEASE_DIR}" "${BRANCH_DIR}/current"

          sudo chown -R www-data:www-data "${BRANCH_DIR}"

      - name: reinicia serviço
        shell: bash
        run: |
          sudo systemctl restart "faqchatbot@${{ steps.env.outputs.branch }}.service"

      - name: limpa releases antigas
        shell: bash
        run: |
          BRANCH_DIR="${BASE_DIR}/${{ steps.env.outputs.branch }}"
          cd "${BRANCH_DIR}/releases"
          ls -1dt */ | tail -n +6 | xargs -r -I{} rm -Rf "{}"
