name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

jobs:
  # CodeQL (SAST) fica desativado enquanto a organizacao nao possuir
  # GitHub Advanced Security: o upload de SARIF falha sem a licenca e
  # o action reporta failure mesmo com continue-on-error. Reabilitar em
  # .github/workflows/security.yml apos contratar GHAS ou tornar o repo
  # publico (ver docs/deploy.md, tabela CI/CD).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requer "Dependency graph" habilitado em Settings > Security.
      # Enquanto isso nao estiver ativo na organizacao, o resultado e informativo.
      - name: Dependency Review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action exige licenca paga em repositorios privados de organizacao;
      # o binario oficial via docker nao exige.
      - name: Gitleaks (docker)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest detect --source . --redact --verbose
