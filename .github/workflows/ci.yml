name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faqchatbot
          POSTGRES_PASSWORD: faqchatbot
          POSTGRES_DB: faqchatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faqchatbot -d faqchatbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://faqchatbot:faqchatbot@localhost:5432/faqchatbot
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-value-123
      JWT_WIDGET_SECRET: ci-widget-secret-value-123
      JWT_REFRESH_SECRET: ci-refresh-secret-value-123
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: faqchatbot-ci
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      CORS_EXTRA_ORIGINS: http://localhost:5173,http://localhost:5174
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm --filter @faqchatbot/api run db:migrate

      - name: Test
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter @faqchatbot/widget exec playwright install --with-deps chromium

      - name: E2E tests (widget)
        run: pnpm --filter @faqchatbot/widget run test:e2e

      - name: E2E tests (dashboard)
        run: pnpm --filter @faqchatbot/dashboard run test:e2e

      - name: Build
        run: pnpm build

      - name: Audit
        run: pnpm audit --audit-level high

