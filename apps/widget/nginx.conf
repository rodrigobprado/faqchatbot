server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /widget.js {
    access_log off;
    add_header Cache-Control "no-cache";
  }

  location ~* ^/widget\.[0-9a-f]+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
