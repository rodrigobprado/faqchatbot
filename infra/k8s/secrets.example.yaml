apiVersion: v1
kind: Secret
metadata:
  name: faqchatbot-secrets
  namespace: faqchatbot
type: Opaque
stringData:
  DATABASE_URL: "postgresql://faqchatbot:${DB_PASSWORD}@postgres.faqchatbot.svc.cluster.local:5432/faqchatbot"
  REDIS_URL: "redis://redis.faqchatbot.svc.cluster.local:6379"
  JWT_ACCESS_SECRET: "CHANGE_ME_MIN_16_CHARS"
  JWT_WIDGET_SECRET: "CHANGE_ME_MIN_16_CHARS"
  JWT_REFRESH_SECRET: "CHANGE_ME_MIN_16_CHARS"
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"
