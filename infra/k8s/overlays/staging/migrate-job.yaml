apiVersion: batch/v1
kind: Job
metadata:
  name: faq-migrate
  namespace: reloc-dev
  labels:
    app: faqchatbot
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: faqchatbot-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: ghcr.io/rigbie-sst/faqchatbot-api:IMAGE_TAG_PLACEHOLDER
          command: ["node", "apps/api/dist/db/migrate.js"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          envFrom:
            - configMapRef:
                name: faq-config
            - secretRef:
                name: faq-secrets
