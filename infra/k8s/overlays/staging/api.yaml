apiVersion: apps/v1
kind: Deployment
metadata:
  name: faq-api
  namespace: reloc-dev
  labels:
    app: faq-api
    app.kubernetes.io/part-of: faqchatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faq-api
  template:
    metadata:
      labels:
        app: faq-api
    spec:
      imagePullSecrets:
      automountServiceAccountToken: false
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/rigbie-sst/faqchatbot-api:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: faq-config
            - secretRef:
                name: faq-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: faq-api
  namespace: reloc-dev
spec:
  selector:
    app: faq-api
  ports:
    - name: http
      port: 80
      targetPort: http
