server {
    listen 80;
    listen [::]:80;
    server_name faqchatbot.rigbie.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name faqchatbot-staging.rigbie.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name faqchatbot-develop.rigbie.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faqchatbot.rigbie.com.br;

    ssl_certificate     /etc/letsencrypt/live/faqchatbot.rigbie.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faqchatbot.rigbie.com.br/privkey.pem;

    root /wwwroot/sites/faqchatbot/main/current/apps/dashboard/dist;
    index index.html;

    access_log /var/log/nginx/faqchatbot-main-access.log;
    error_log  /var/log/nginx/faqchatbot-main-error.log;

    location = /widget.js {
        alias /wwwroot/sites/faqchatbot/main/current/apps/widget/dist/widget.js;
        add_header Cache-Control "public, max-age=300";
    }

    location ~ ^/(health|docs|v1/) {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

